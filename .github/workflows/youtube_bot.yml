name: AI Cartoon Shorts Bot (Telegram + Auto YouTube)

on:
  # 1. Bisa dijalankan manual langsung dari tab Actions di GitHub dengan mengetik topik
  workflow_dispatch:
    inputs:
      topic:
        description: "Topik cerita (Kosongkan jika ingin ambil dari chat Telegram)"
        required: false
        default: ""

  # 2. Otomatis mengecek chat Telegram kamu secara berkala
  schedule:
    - cron: "*/30 * * * *"

jobs:
  build_and_upload_short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 & FFmpeg
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Fonts & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-color-emoji

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot (From Input Topic or Telegram Chat)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          YOUTUBE_TOKEN_BASE64: ${{ secrets.YOUTUBE_TOKEN_BASE64 }}
          TTS_VOICE: "id-ID-ArdiNeural"
          TTS_RATE: "+5%"
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python main.py --topic "${{ github.event.inputs.topic }}" --upload
          else
            python telegram_bot.py --check-once
          fi

      - name: Save Telegram Offset so Messages Are Not Repeated
        if: always()
        run: |
          if [ -f telegram_last_update.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f telegram_last_update.txt
            git diff --staged --quiet || (git commit -m "Update Telegram offset [skip ci]" && git push)
          fi
