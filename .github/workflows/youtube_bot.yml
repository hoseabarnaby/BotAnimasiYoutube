name: AI Cartoon Shorts Bot (Telegram + Auto YouTube)

on:
  push:
    branches: [ main ]

  workflow_dispatch:
    inputs:
      topic:
        description: "Topik cerita (Kosongkan jika ingin ambil dari chat Telegram)"
        required: false
        default: ""

  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: telegram_bot_listener
  cancel-in-progress: true

jobs:
  build_and_upload_short:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Setup FFmpeg & FFprobe (Fast Static Binary - 3 Seconds, No apt-get!)
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Setup Color Emoji & Hand Fonts (Fast 1-Second Download)
        run: |
          sudo mkdir -p /usr/share/fonts/truetype/noto /usr/share/fonts/truetype/humor-sans
          sudo curl -sL https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf -o /usr/share/fonts/truetype/noto/NotoColorEmoji.ttf
          sudo curl -sL https://github.com/shreyankg/xkcd-desktop/raw/master/Humor-Sans.ttf -o /usr/share/fonts/truetype/humor-sans/Humor-Sans.ttf || true

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot Nonstop (Standby 5 Jam Penuh Menunggu Chat Telegram Kamu)
        run: |
          export PYTHONUNBUFFERED=1
          ffmpeg -version
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python -u main.py --topic "${{ github.event.inputs.topic }}" --upload
          else
            python -u telegram_bot.py --max-minutes 300
          fi

      - name: Save Telegram Offset so Messages Are Not Repeated
        if: always()
        run: |
          if [ -f telegram_last_update.txt ]; then
            git pull --rebase origin main || true
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f telegram_last_update.txt youtube_token.pickle
            git diff --staged --quiet || (git commit -m "Update Telegram offset [skip ci]" && git push)
          fi
