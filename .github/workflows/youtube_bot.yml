name: AI Cartoon Shorts Bot (Telegram + Auto YouTube)

on:
  # 1. OTOMATIS LANGSUNG JALAN BEGITU DI-UPLOAD (PUSH) KE GITHUB!
  push:
    branches: [ main ]

  # 2. Bisa juga dijalankan manual dari tab Actions
  workflow_dispatch:
    inputs:
      topic:
        description: "Topik cerita (Kosongkan jika ingin ambil dari chat Telegram)"
        required: false
        default: ""

  # 3. Otomatis nyambung terus menerus
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: telegram_bot_listener
  cancel-in-progress: true

jobs:
  build_and_upload_short:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Fonts & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-color-emoji

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot Nonstop (Standby 5 Jam Penuh Menunggu Chat Telegram Kamu)
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python main.py --topic "${{ github.event.inputs.topic }}" --upload
          else
            python telegram_bot.py --max-minutes 300
          fi

      - name: Save Telegram Offset so Messages Are Not Repeated
        if: always()
        run: |
          if [ -f telegram_last_update.txt ]; then
            git pull --rebase origin main || true
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f telegram_last_update.txt youtube_token.pickle
            git diff --staged --quiet || (git commit -m "Update Telegram offset [skip ci]" && git push)
          fi
