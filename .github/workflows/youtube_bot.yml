name: AI Cartoon Shorts Bot (Telegram + Auto YouTube)

on:
  # 1. Bisa dijalankan manual langsung dari tab Actions di GitHub
  workflow_dispatch:
    inputs:
      topic:
        description: "Topik cerita (Kosongkan jika ingin ambil dari chat Telegram)"
        required: false
        default: ""

  # 2. Otomatis mengecek chat Telegram kamu secara berkala
  schedule:
    - cron: "*/15 * * * *"

jobs:
  build_and_upload_short:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System Fonts & FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu-core fonts-noto-color-emoji

      - name: Install Python Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Bot (Otomatis Standby 25 Menit Menunggu Chat Telegram Kamu)
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python main.py --topic "${{ github.event.inputs.topic }}" --upload
          else
            python telegram_bot.py --max-minutes 25
          fi

      - name: Save Telegram Offset so Messages Are Not Repeated
        if: always()
        run: |
          if [ -f telegram_last_update.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f telegram_last_update.txt youtube_token.pickle
            git diff --staged --quiet || (git commit -m "Update Telegram offset [skip ci]" && git push)
          fi
